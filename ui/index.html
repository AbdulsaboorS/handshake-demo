<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Handshake</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2311121a'/><circle cx='12.5' cy='16' r='5' fill='none' stroke='%23fff' stroke-width='2.4'/><circle cx='19.5' cy='16' r='5' fill='none' stroke='%23fff' stroke-width='2.4'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f5f1;
    --surface: #ffffff;
    --ink: #111216;
    --muted: #686b74;
    --faint: #a4a6ad;
    --line: #e4e2dc;
    --accent: #34308f;
    --accent-soft: #34308f12;
    --ok: #1d7048;
    --bad: #b03a2e;
    --mono: "Geist Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); overflow: hidden;
    font: 16px/1.5 Geist, system-ui, sans-serif; -webkit-font-smoothing: antialiased;
    display: grid; grid-template-rows: auto 1fr;
  }
  button { font: inherit; color: inherit; }

  header { display: flex; align-items: center; gap: 28px; padding: 22px 48px; }
  .brand { margin-right: auto; display: flex; align-items: baseline; gap: 14px; }
  .brand b { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
  .brand span { color: var(--muted); font-size: 14px; }
  .tabs { display: flex; padding: 3px; border-radius: 999px; background: #ebe9e3; }
  .tabs button { all: unset; cursor: pointer; font-size: 14px; color: var(--muted); padding: 7px 16px; border-radius: 999px; transition: background .15s, color .15s; }
  .tabs button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 500; box-shadow: 0 1px 3px #11121614, 0 0 0 1px var(--line); }
  .tabs:has(button:disabled) { opacity: .5; }
  .toggle { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); cursor: pointer; user-select: none; }
  .toggle input { accent-color: var(--ink); margin: 0; }
  .start { all: unset; cursor: pointer; font-size: 14px; font-weight: 500; padding: 9px 18px; border-radius: 999px; background: var(--ink); color: var(--bg); }
  .start:disabled { opacity: .3; cursor: default; }

  main { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 48px; padding: 8px 48px 40px; min-height: 0; }
  .label { font-size: 12px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }

  /* call */
  .call { display: flex; flex-direction: column; min-height: 0; }
  .status { display: flex; align-items: center; gap: 22px; padding-bottom: 18px; border-bottom: 1px solid var(--line); font-size: 15px; }
  .party { display: flex; align-items: center; gap: 9px; font-weight: 500; }
  .party small { color: var(--muted); font-weight: 400; font-size: 14px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); transition: background .15s, transform .08s; }
  .party.talking .dot { background: var(--accent); }
  .arrow { color: var(--faint); }
  .meta { margin-left: auto; display: flex; gap: 18px; font: 13px var(--mono); color: var(--faint); }
  .meta .live { color: var(--ink); }

  #transcript { flex: 1; overflow-y: auto; padding: 28px 0; display: flex; flex-direction: column; gap: 22px; scrollbar-width: none; }
  #transcript::-webkit-scrollbar { display: none; }
  .empty { margin: auto 0; max-width: 620px; }
  .empty b { display: block; font-size: 26px; font-weight: 500; letter-spacing: -0.02em; margin-bottom: 8px; }
  .empty p { margin: 0; color: var(--muted); font-size: 19px; line-height: 1.45; }
  .scenario { font: 13px var(--mono); color: var(--accent); background: var(--accent-soft); padding: 3px 10px; border-radius: 999px; }
  .line { display: grid; grid-template-columns: 112px minmax(0, 1fr) 56px; gap: 0 20px; animation: in .3s ease-out; }
  .who { font-size: 12px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); padding-top: 6px; }
  .line.airline .who { color: var(--accent); }
  .text { font-size: 21px; line-height: 1.45; letter-spacing: -0.01em; }
  .text .w { opacity: 0; animation: word .2s forwards; }
  .heard { font: 13px/1.5 var(--mono); color: var(--faint); margin-top: 6px; }
  .gap { font: 12px var(--mono); color: var(--faint); text-align: right; padding-top: 8px; }
  .event { margin-left: 132px; font: 13px var(--mono); color: var(--muted); animation: in .3s ease-out; }
  .event b { color: var(--ink); font-weight: 500; }
  .event.ok b { color: var(--ok); }
  .event.bad b { color: var(--bad); }
  @keyframes word { to { opacity: 1; } }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } }

  /* trust */
  .trust { display: flex; flex-direction: column; min-height: 0; overflow-y: auto; scrollbar-width: none; }
  .trust::-webkit-scrollbar { display: none; }
  .trust > p { margin: 6px 0 24px; color: var(--muted); font-size: 15px; }
  .check { position: relative; padding: 0 0 22px 30px; }
  .check::before { content: ""; position: absolute; left: 6px; top: 20px; bottom: 2px; width: 1px; background: var(--line); }
  .check:last-child::before { display: none; }
  .check i { position: absolute; left: 0; top: 5px; width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--bg); transition: all .3s; }
  .check.done i { background: var(--ok); border-color: var(--ok); }
  .check.wait i { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .check.fail i { background: var(--bad); border-color: var(--bad); }
  .check h3 { margin: 0; font-size: 17px; font-weight: 500; color: var(--faint); transition: color .3s; }
  .check.done h3, .check.wait h3, .check.fail h3 { color: var(--ink); }
  .check .body { color: var(--muted); font-size: 15px; margin-top: 2px; }
  .check .body:empty { display: none; }
  .mono { font-family: var(--mono); font-size: 13px; }

  .card { margin-top: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px 22px; box-shadow: 0 12px 32px #1112160d; animation: in .35s ease-out; }
  .card .from { font-size: 13px; color: var(--muted); }
  .card h4 { margin: 4px 0 8px; font-size: 19px; font-weight: 500; letter-spacing: -0.01em; color: var(--ink); }
  .card p { margin: 0; font-size: 16px; color: var(--ink); }
  .bar { height: 3px; border-radius: 2px; background: var(--line); margin: 18px 0 8px; overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--accent); transform-origin: left; }
  .countdown { display: flex; justify-content: space-between; font: 13px var(--mono); color: var(--muted); }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
  .actions button { all: unset; cursor: pointer; text-align: center; padding: 11px; border-radius: 999px; font-size: 15px; font-weight: 500; }
  .actions .deny { border: 1px solid var(--line); }
  .actions .allow { background: var(--ink); color: var(--bg); }
  .actions button:disabled { opacity: .4; cursor: default; }
  .noanswer { margin-top: 16px; text-align: center; font-size: 14px; color: var(--muted); padding: 10px; border-radius: 999px; border: 1px dashed var(--line); }
  .verdict { margin-top: 16px; font-size: 15px; font-weight: 500; }
  .verdict.approved { color: var(--ok); }
  .verdict.denied, .verdict.expired { color: var(--bad); }

  .outcome { margin-top: 8px; padding-top: 22px; border-top: 1px solid var(--line); animation: in .35s ease-out; }
  .outcome h2 { margin: 0 0 6px; font-size: 24px; font-weight: 500; letter-spacing: -0.02em; }
  .outcome.ok h2 { color: var(--ok); }
  .outcome.none h2 { color: var(--bad); }
  .outcome p { margin: 0 0 14px; color: var(--muted); font-size: 15px; }
  .outcome blockquote { margin: 0; padding-left: 14px; border-left: 2px solid var(--line); font-size: 16px; }
  .error { margin-top: 12px; font: 13px var(--mono); color: var(--bad); }

  #log { display: none; position: fixed; inset: auto 48px 24px 48px; max-height: 40vh; overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; font: 12px/1.7 var(--mono); color: var(--muted); box-shadow: 0 12px 32px #11121614; }
  #log.open { display: block; }
  #log b { color: var(--ink); font-weight: 500; }

  @media (max-width: 1000px) {
    body { overflow: auto; }
    header { flex-wrap: wrap; padding: 16px; gap: 14px 20px; }
    main { grid-template-columns: 1fr; padding: 8px 16px 32px; }
    .line { grid-template-columns: 1fr; }
    .gap { text-align: left; padding: 0; }
    .event { margin-left: 0; }
    .meta { display: none; }
  }
</style>
</head>
<body>
<header>
  <div class="brand"><b>Handshake</b><span>PACT over a live voice call</span></div>
  <div class="tabs" role="group" aria-label="Scenario">
    <button data-scenario="happy" aria-pressed="true">Owner approves</button>
    <button data-scenario="unreachable" aria-pressed="false">Owner unreachable</button>
    <button data-scenario="overreach" aria-pressed="false">Agent lies</button>
  </div>
  <label class="toggle"><input type="checkbox" id="voice" checked> Voice</label>
  <button class="start" id="start">Start call</button>
</header>
<main>
  <section class="call">
    <div class="status">
      <span class="party" id="party-agent"><span class="dot"></span>Pocket <small>for Abdul</small></span>
      <span class="arrow">&rarr;</span>
      <span class="party" id="party-airline"><span class="dot"></span>Northwind Airways <small>support</small></span>
      <span class="meta"><span class="scenario" id="scenario-tag"></span><span id="median"></span><span id="timer">00:00</span></span>
    </div>
    <div id="transcript"></div>
  </section>
  <aside class="trust">
    <div class="label">Trust</div>
    <p>Checked in code. Nothing here is the model's call.</p>
    <div id="checks"></div>
  </aside>
</main>
<div id="log"></div>
<script>
const SCENARIOS = {
  happy: ["Owner approves", "Pocket asks Northwind to move Abdul's flight. The change needs his approval, and he taps Approve on his phone."],
  unreachable: ["Owner unreachable", "Same call, but Abdul never answers his phone. Watch the request expire and nothing get charged."],
  overreach: ["Agent lies", "Pocket tells Northwind that Abdul already approved. He didn't. Watch the code ignore the claim."],
};
const CHECKS = [["verified", "Caller verified"], ["bound", "Call bound"], ["approval", "Owner approval"], ["receipt", "Signed receipt"]];
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const NAMES = { agent: "Pocket", airline: "Northwind" };
let scenario = "happy", voiceCall = false, clockOffset = 0, countdown = null, callTimer = null, approvalId = null, approvalStatus = null;
let lastPlayEnd = null, heldSince = 0, gaps = [];
const lastLine = {};

// ---- speaking dots: real audio level in voice mode, a short pulse per line in text mode ----
const levels = { agent: 0, airline: 0 };
const textTalk = { agent: 0, airline: 0 };
function renderTalk() {
  const now = performance.now();
  for (const who of ["agent", "airline"]) {
    const lvl = voiceCall ? levels[who] : (now < textTalk[who] ? 0.6 : 0);
    const el = $(`#party-${who}`);
    el.classList.toggle("talking", lvl > 0.06);
    el.querySelector(".dot").style.transform = `scale(${1 + Math.min(1, lvl) * 0.6})`;
  }
  requestAnimationFrame(renderTalk);
}
requestAnimationFrame(renderTalk);

// ---- trust checks ----
function renderChecks() {
  $("#checks").innerHTML = CHECKS.map(([id, title]) =>
    `<div class="check" id="c-${id}"><i></i><h3>${title}</h3><div class="body"></div></div>`).join("");
}
function check(id, state, html) {
  const el = $(`#c-${id}`);
  el.classList.remove("done", "wait", "fail");
  if (state) el.classList.add(state);
  if (html !== undefined) el.querySelector(".body").innerHTML = html;
}

// ---- transcript ----
function add(el) {
  const t = $("#transcript");
  t.querySelector(".empty")?.remove();
  t.appendChild(el);
  t.scrollTop = t.scrollHeight;
}
function say(speaker, text) {
  const el = document.createElement("div");
  el.className = `line ${speaker}`;
  const words = esc(text).split(/\s+/);
  el.innerHTML = `<div class="who">${NAMES[speaker]}</div><div><div class="text">${words.map((w, i) =>
    `<span class="w" style="animation-delay:${i * 40}ms">${w}</span>`).join(" ")}</div></div><div class="gap"></div>`;
  add(el);
  lastLine[speaker] = el;
  textTalk[speaker] = performance.now() + words.length * 40 + 300;
}
const plain = (s) => s.toLowerCase().replace(/[^a-z0-9]/g, "");
function heard(e) {
  const speaker = e.by === "airline" ? "agent" : "airline";
  const el = lastLine[speaker];
  if (!el) return;
  // Only show what the other side heard when it differs: that's where speech recognition got it wrong.
  const said = el.querySelector(".text").textContent;
  if (plain(said) !== plain(e.text)) {
    el.querySelector(".text").insertAdjacentHTML("afterend", `<div class="heard">${NAMES[e.by]} heard: ${esc(e.text) || "(nothing)"}</div>`);
  }
  if (lastPlayEnd !== null && e.play_start) {
    const gap = e.play_start - lastPlayEnd - heldSince;
    gaps.push(gap);
    el.querySelector(".gap").textContent = `${gap.toFixed(1)}s`;
    const sorted = [...gaps].sort((a, b) => a - b);
    $("#median").textContent = `median gap ${sorted[Math.floor(sorted.length / 2)].toFixed(1)}s`;
  }
  if (e.play_end) lastPlayEnd = e.play_end;
  heldSince = 0;
  $("#transcript").scrollTop = $("#transcript").scrollHeight;
}
function event(html, tone = "") {
  const el = document.createElement("div");
  el.className = `event ${tone}`;
  el.innerHTML = html;
  add(el);
}
function tool(e) {
  if (e.side !== "airline" || e.name !== "change_flight") return;
  const r = e.result || {};
  if (r.note) event(`change_flight &rarr; <b>AUTH_REQUIRED</b>, still waiting on Abdul`);
  else if (r.status === "TASK_STATE_AUTH_REQUIRED") event(`change_flight &rarr; <b>AUTH_REQUIRED</b>, asking Abdul`);
  else if (r.status === "changed") event(`change_flight &rarr; <b>changed</b>, $${r.charged_usd.toFixed(2)} charged`, "ok");
  else if (r.status === "not_approved") event(`change_flight &rarr; <b>refused</b>, no approval`, "bad");
}

// ---- owner approval ----
function approvalCard(e) {
  approvalId = e.approval_id;
  const reachable = scenario !== "unreachable";
  check("approval", "wait", `<div class="card" id="approval">
      <div class="from">Northwind Airways, on Abdul's phone</div>
      <h4>Approve this change?</h4>
      <p>${esc(e.intent)}</p>
      <div class="bar"><span></span></div>
      <div class="countdown"><span>code ${esc(e.user_code)}, this change only</span><span id="secs"></span></div>
      ${reachable
        ? `<div class="actions"><button class="deny" onclick="decide(false)">Deny</button><button class="allow" onclick="decide(true)">Approve</button></div>`
        : `<div class="noanswer">Abdul isn't picking up</div>`}
    </div>`);
  const total = e.expires_at - (Date.now() / 1000 + clockOffset);
  clearInterval(countdown);
  const tick = () => {
    const left = Math.max(0, e.expires_at - (Date.now() / 1000 + clockOffset));
    $("#secs").textContent = `${Math.ceil(left)}s`;
    $("#approval .bar span").style.transform = `scaleX(${left / total})`;
    if (left <= 0) clearInterval(countdown);
  };
  tick();
  countdown = setInterval(tick, 100);
}
async function decide(approve) {
  if (!approvalId || approvalStatus) return;
  document.querySelectorAll("#approval .actions button").forEach((b) => b.disabled = true);
  await fetch(`/approvals/${approvalId}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ approve }) });
}
function decided(status) {
  if (approvalStatus) return;  // owner_decided and approval_resolved both land here; the first one wins
  clearInterval(countdown);
  approvalStatus = status;
  const ok = status === "approved";
  document.querySelector("#approval .actions, #approval .noanswer")?.remove();
  $("#approval .bar span").style.transform = ok ? "scaleX(1)" : "scaleX(0)";
  $("#secs").textContent = "";
  $("#approval h4").textContent = ok ? "Change approved" : status === "denied" ? "Change denied" : "Request expired";
  $("#approval").insertAdjacentHTML("beforeend", `<div class="verdict ${status}">${
    ok ? "Approved by Abdul. Northwind is making the change." : status === "denied" ? "Denied by Abdul. Nothing will change." : "No answer. Expired."}</div>`);
  $("#c-approval").classList.replace("wait", ok ? "done" : "fail");
}

function outcome(c) {
  const el = document.createElement("div");
  if (c.actions.length) {
    const a = c.actions[0];
    el.className = "outcome ok";
    el.innerHTML = `<h2>Flight changed. $${(a.charged_cents / 100).toFixed(2)} charged.</h2><p>Abdul approved on his phone. Receipt signed by Northwind, verified by Pocket.</p>`;
  } else {
    const why = scenario === "overreach" ? "Pocket claimed an approval it didn't have. Code ignored it."
      : approvalStatus === "denied" ? "Abdul said no."
      : approvalStatus === "expired" ? "Abdul didn't answer, so the request expired."
      : "No approval was requested.";
    el.className = "outcome none";
    el.innerHTML = `<h2>Nothing changed. Nothing charged.</h2><p>${why} The signed receipt lists no actions.</p>`;
  }
  $(".trust").appendChild(el);
}

// ---- events ----
function handle(e) {
  clockOffset = e.t - Date.now() / 1000;
  const { kind, t, ...rest } = e;
  $("#log").insertAdjacentHTML("beforeend", `<div>${new Date(t * 1000).toISOString().slice(11, 23)} <b>${kind}</b> ${esc(JSON.stringify(rest)).slice(0, 240)}</div>`);

  switch (kind) {
    case "call_started": {
      $("#transcript").innerHTML = "";
      document.querySelectorAll(".outcome, .error").forEach((el) => el.remove());
      $("#log").innerHTML = $("#log").lastElementChild.outerHTML;
      renderChecks(); clearInterval(countdown);
      approvalId = approvalStatus = lastPlayEnd = null; heldSince = 0; gaps = [];
      $("#median").textContent = "";
      selectScenario(e.scenario); voiceCall = e.voice;
      const start = Date.now();
      clearInterval(callTimer);
      $("#timer").classList.add("live");
      callTimer = setInterval(() => $("#timer").textContent = new Date(Date.now() - start).toISOString().slice(14, 19), 250);
      $("#start").disabled = true;
      document.querySelectorAll(".tabs button").forEach((b) => b.disabled = true);
      break;
    }
    case "registered":
      check("verified", "done", `Pocket, acting for Abdul. Signed agent token, read-only access he granted earlier.<div class="mono">${e.scopes.map(esc).join(", ")}</div>`);
      break;
    case "call_code_issued": check("bound", "wait", `One-time code <span class="mono">${esc(e.code)}</span> issued`); break;
    case "line_open": listen(); break;
    case "call_bound":
      check("bound", "done", e.in_band
        ? `Code <span class="mono">${esc(e.code)}</span> sent as keypad tones and matched to the verified session`
        : `Code <span class="mono">${esc(e.code)}</span> matched to the verified session`);
      event(`call bound, code <b>${esc(e.code)}</b>`);
      break;
    case "say": say(e.speaker, e.text); break;
    case "heard": heard(e); break;
    case "hold": heldSince += e.seconds; break;
    case "tool": tool(e); break;
    case "owner_notified": approvalCard(e); break;
    case "owner_decided": decided(e.status); break;
    case "approval_resolved": decided(e.status); break;
    case "receipt": {
      const a = e.claims.actions;
      check("receipt", a.length ? "done" : "fail", a.length
        ? `Signed by Northwind, verified by Pocket. 1 action, $${(a[0].charged_cents / 100).toFixed(2)}.`
        : `Signed by Northwind, verified by Pocket. No actions.`);
      outcome(e.claims);
      break;
    }
    case "report":
      document.querySelector(".outcome")?.insertAdjacentHTML("beforeend", `<div class="label">Pocket to Abdul</div><blockquote>${esc(e.text)}</blockquote>`);
      break;
    case "error":
      $(".trust").insertAdjacentHTML("beforeend", `<div class="error">${esc(e.message)}</div>`);
      break;
    case "call_ended":
      listener?.close(); listener = null;
      levels.agent = levels.airline = 0;
      clearInterval(callTimer); $("#timer").classList.remove("live");
      $("#start").disabled = false;
      document.querySelectorAll(".tabs button").forEach((b) => b.disabled = false);
      break;
  }
}

// ---- listening in over Cloudflare Realtime ----
let listener = null;
async function listen() {
  listener?.close();
  const { session, offer } = await (await fetch("/rtc/listen", { method: "POST" })).json();
  const pc = listener = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.cloudflare.com:3478" }] });
  const ctx = new AudioContext();
  pc.ontrack = (e) => {
    const stream = new MediaStream([e.track]);
    const audio = new Audio();
    audio.srcObject = stream;
    audio.play();
    // The SFU offers tracks in the order the server asked for them: Pocket, then Northwind.
    const who = pc.getTransceivers().indexOf(e.transceiver) === 0 ? "agent" : "airline";
    const analyser = ctx.createAnalyser();
    analyser.fftSize = 512;
    ctx.createMediaStreamSource(stream).connect(analyser);
    const buf = new Uint8Array(analyser.fftSize);
    const read = () => {
      if (pc !== listener) return;
      analyser.getByteTimeDomainData(buf);
      let peak = 0;
      for (const v of buf) peak = Math.max(peak, Math.abs(v - 128));
      levels[who] = peak / 64;
      requestAnimationFrame(read);
    };
    read();
  };
  await pc.setRemoteDescription(offer);
  await pc.setLocalDescription(await pc.createAnswer());
  await new Promise((r) => pc.iceGatheringState === "complete" ? r() : pc.addEventListener("icegatheringstatechange", () => pc.iceGatheringState === "complete" && r()));
  await fetch("/rtc/answer", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ session, sdp: pc.localDescription.sdp }) });
}

// ---- controls ----
function selectScenario(s) {
  scenario = s;
  document.querySelectorAll(".tabs button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.scenario === s));
  $("#scenario-tag").textContent = SCENARIOS[s][0];
  // Before a call starts, the transcript area says what's about to happen.
  if (!$("#transcript .line") && !$("#start").disabled) {
    $("#transcript").innerHTML = `<div class="empty"><b>${SCENARIOS[s][0]}</b><p>${SCENARIOS[s][1]}</p></div>`;
  }
}
document.querySelectorAll(".tabs button").forEach((b) => b.onclick = () => { $("#transcript").innerHTML = ""; selectScenario(b.dataset.scenario); });
$("#start").onclick = () => fetch("/calls", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ scenario, voice: $("#voice").checked }) });

// Recording shortcuts: 1/2/3 pick a scenario, V toggles voice, Enter starts, A approves, D denies, L shows the audit log.
document.addEventListener("keydown", (e) => {
  const pick = { 1: "happy", 2: "unreachable", 3: "overreach" }[e.key];
  if (pick && !$("#start").disabled) { $("#transcript").innerHTML = ""; selectScenario(pick); }
  const k = e.key.toLowerCase();
  if (k === "v") $("#voice").checked = !$("#voice").checked;
  if (e.key === "Enter" && !$("#start").disabled) $("#start").click();
  if (k === "a" && scenario !== "unreachable") decide(true);
  if (k === "d") decide(false);
  if (k === "l") $("#log").classList.toggle("open");
});

function connect() {
  const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/events`);
  ws.onmessage = (m) => handle(JSON.parse(m.data));
  ws.onclose = () => setTimeout(connect, 1000);
}
renderChecks();
selectScenario(scenario);
connect();
</script>
</body>
</html>
