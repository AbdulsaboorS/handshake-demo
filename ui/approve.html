<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Northwind Approval</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --line: #e3e6ec; --text: #10131a; --muted: #687083;
    --brand: #0e7490; --ok: #059669; --bad: #dc2626; --warn: #d97706;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b0d12; --card: #151922; --line: #262b38; --text: #eef0f4; --muted: #8a91a3; --brand: #38bdf8; --ok: #34d399; --bad: #f87171; --warn: #fbbf24; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font: 16px/1.5 Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased;
    padding: max(20px, env(safe-area-inset-top)) 16px 24px; display: flex; flex-direction: column; gap: 16px;
  }
  .top { display: flex; align-items: center; gap: 10px; font-weight: 700; }
  .top i { width: 28px; height: 28px; border-radius: 8px; background: var(--brand); }
  .top span { margin-left: auto; font-weight: 500; font-size: 13px; color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 20px; }
  h1 { font-size: 21px; line-height: 1.3; margin: 0 0 6px; letter-spacing: -0.01em; }
  .muted { color: var(--muted); font-size: 14px; }
  .intent { margin: 16px 0; padding: 14px; border-radius: 12px; background: var(--bg); font-weight: 500; }
  ul { list-style: none; padding: 0; margin: 0 0 16px; display: grid; gap: 8px; }
  li { display: flex; gap: 10px; font-size: 14.5px; }
  li::before { content: ""; flex: none; width: 8px; height: 8px; margin-top: 7px; border-radius: 50%; background: var(--warn); }
  .meta { display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: var(--muted); }
  .code { font: 500 15px "JetBrains Mono", monospace; color: var(--text); letter-spacing: .1em; }
  .timer { font: 500 15px "JetBrains Mono", monospace; color: var(--warn); }
  .bar { height: 4px; border-radius: 2px; background: var(--line); margin: 12px 0 18px; overflow: hidden; }
  .bar div { height: 100%; background: var(--warn); transition: width .1s linear; }
  .buttons { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; }
  button { font: 600 16px Inter, sans-serif; padding: 15px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer; }
  button.allow { background: var(--ok); border-color: var(--ok); color: #fff; }
  .done { text-align: center; padding: 28px 20px; }
  .done b { display: block; font-size: 22px; margin-bottom: 6px; }
  .done.approved b { color: var(--ok); }
  .done.denied b, .done.expired b { color: var(--bad); }
  .foot { margin-top: auto; text-align: center; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
  <div class="top"><i></i>Northwind Airways<span>Signed in as Abdul S.</span></div>
  <div id="view" class="card"><h1>No requests right now</h1><div class="muted">When your agent needs more access, it'll show up here.</div></div>
  <div class="foot">Only you can grant this. Your agent never sees your password.</div>

<script>
const SCOPE_TEXT = {
  "bookings:change": "Change flights on your bookings",
  "payments:charge": "Charge your card on file",
};
const view = document.getElementById("view");
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let pending = null, scopes = [], offset = 0, timer = null;

function show(e) {
  pending = e;
  view.innerHTML = `
    <h1>Pocket wants to make a change for you</h1>
    <div class="muted">Your AI agent is on a call with Northwind support.</div>
    <div class="intent">${esc(e.intent)}</div>
    <ul>${scopes.map((s) => `<li>${esc(SCOPE_TEXT[s] || s)}, for this change only</li>`).join("")}</ul>
    <div class="meta"><span>Code <span class="code">${esc(e.user_code)}</span></span><span class="timer" id="left"></span></div>
    <div class="bar"><div id="fill"></div></div>
    <div class="buttons"><button onclick="decide(false)">Deny</button><button class="allow" onclick="decide(true)">Approve</button></div>`;
  const total = e.expires_at - (Date.now() / 1000 + offset);
  clearInterval(timer);
  timer = setInterval(() => {
    const left = Math.max(0, e.expires_at - (Date.now() / 1000 + offset));
    document.getElementById("left").textContent = `${Math.ceil(left)}s left`;
    document.getElementById("fill").style.width = `${(left / total) * 100}%`;
    if (left <= 0) clearInterval(timer);
  }, 100);
  navigator.vibrate?.([200, 100, 200]);
}

function resolved(status) {
  clearInterval(timer);
  pending = null;
  const text = { approved: ["Approved", "Pocket can make this one change."], denied: ["Denied", "Nothing will be changed or charged."], expired: ["Expired", "No answer in time. Nothing was changed or charged."] }[status];
  view.innerHTML = `<div class="done ${status}"><b>${text[0]}</b><div class="muted">${text[1]}</div></div>`;
}

async function decide(approve) {
  if (!pending) return;
  await fetch(`/approvals/${pending.approval_id}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ approve }) });
}

function connect() {
  const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/events`);
  ws.onmessage = (m) => {
    const e = JSON.parse(m.data);
    offset = e.t - Date.now() / 1000;
    if (e.kind === "call_started") { clearInterval(timer); pending = null; view.innerHTML = `<h1>No requests right now</h1><div class="muted">Pocket is on a call with Northwind.</div>`; }
    if (e.kind === "auth_required") scopes = Object.keys(e.scopes);
    if (e.kind === "owner_notified") show(e);
    if (e.kind === "approval_resolved") resolved(e.status);
  };
  ws.onclose = () => setTimeout(connect, 1000);
}
connect();
</script>
</body>
</html>
