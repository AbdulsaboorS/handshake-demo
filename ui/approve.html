<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Northwind Approval</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f5f1; --card: #ffffff; --line: #e4e2dc; --text: #111216; --muted: #686b74;
    --accent: #34308f; --ok: #1d7048; --bad: #b03a2e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111216; --card: #1a1b20; --line: #2c2d33; --text: #f1f0ec; --muted: #9a9ca3; --accent: #9d98f0; --ok: #5bc48f; --bad: #ec8075; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font: 16px/1.5 Geist, system-ui, sans-serif; -webkit-font-smoothing: antialiased;
    padding: max(20px, env(safe-area-inset-top)) 16px 24px; display: flex; flex-direction: column; gap: 16px;
  }
  .top { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: -0.01em; }
  .top i { display: none; }
  .top span { margin-left: auto; font-weight: 400; font-size: 13px; color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 22px; }
  h1 { font-size: 21px; font-weight: 500; line-height: 1.3; margin: 0 0 6px; letter-spacing: -0.01em; }
  .muted { color: var(--muted); font-size: 14px; }
  .intent { margin: 18px 0; font-size: 17px; }
  ul { list-style: none; padding: 0; margin: 0 0 18px; display: grid; gap: 6px; }
  li { font-size: 14px; color: var(--muted); }
  .meta { display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: var(--muted); }
  .code { font: 500 14px "Geist Mono", monospace; color: var(--text); letter-spacing: .08em; }
  .timer { font: 500 14px "Geist Mono", monospace; color: var(--text); }
  .bar { height: 3px; border-radius: 2px; background: var(--line); margin: 12px 0 20px; overflow: hidden; }
  .bar div { height: 100%; background: var(--accent); transition: width .1s linear; }
  .buttons { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; }
  button { font: 500 16px Geist, sans-serif; padding: 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer; }
  button.allow { background: var(--text); border-color: var(--text); color: var(--bg); }
  .done { text-align: center; padding: 28px 20px; }
  .done b { display: block; font-size: 22px; font-weight: 500; margin-bottom: 6px; }
  .done.approved b { color: var(--ok); }
  .done.denied b, .done.expired b { color: var(--bad); }
  .foot { margin-top: auto; text-align: center; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
  <div class="top"><i></i>Northwind Airways<span>Signed in as Abdul S.</span></div>
  <div id="view" class="card"><h1>No requests right now</h1><div class="muted">When your agent needs more access, it'll show up here.</div></div>
  <div class="foot">Only you can grant this. Your agent never sees your password.</div>

<script>
const SCOPE_TEXT = {
  "bookings:change": "Change flights on your bookings",
  "payments:charge": "Charge your card on file",
};
const view = document.getElementById("view");
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let pending = null, scopes = [], offset = 0, timer = null;

function show(e) {
  pending = e;
  view.innerHTML = `
    <h1>Pocket wants to make a change for you</h1>
    <div class="muted">Your AI agent is on a call with Northwind support.</div>
    <div class="intent">${esc(e.intent)}</div>
    <ul>${scopes.map((s) => `<li>${esc(SCOPE_TEXT[s] || s)}, for this change only</li>`).join("")}</ul>
    <div class="meta"><span>Code <span class="code">${esc(e.user_code)}</span></span><span class="timer" id="left"></span></div>
    <div class="bar"><div id="fill"></div></div>
    <div class="buttons"><button onclick="decide(false)">Deny</button><button class="allow" onclick="decide(true)">Approve</button></div>`;
  const total = e.expires_at - (Date.now() / 1000 + offset);
  clearInterval(timer);
  timer = setInterval(() => {
    const left = Math.max(0, e.expires_at - (Date.now() / 1000 + offset));
    document.getElementById("left").textContent = `${Math.ceil(left)}s left`;
    document.getElementById("fill").style.width = `${(left / total) * 100}%`;
    if (left <= 0) clearInterval(timer);
  }, 100);
  navigator.vibrate?.([200, 100, 200]);
}

function resolved(status) {
  clearInterval(timer);
  pending = null;
  const text = { approved: ["Approved", "Pocket can make this one change."], denied: ["Denied", "Nothing will be changed or charged."], expired: ["Expired", "No answer in time. Nothing was changed or charged."] }[status];
  view.innerHTML = `<div class="done ${status}"><b>${text[0]}</b><div class="muted">${text[1]}</div></div>`;
}

async function decide(approve) {
  if (!pending) return;
  await fetch(`/approvals/${pending.approval_id}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ approve }) });
}

function connect() {
  const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/events`);
  ws.onmessage = (m) => {
    const e = JSON.parse(m.data);
    offset = e.t - Date.now() / 1000;
    if (e.kind === "call_started") { clearInterval(timer); pending = null; view.innerHTML = `<h1>No requests right now</h1><div class="muted">Pocket is on a call with Northwind.</div>`; }
    if (e.kind === "auth_required") scopes = Object.keys(e.scopes);
    if (e.kind === "owner_notified") show(e);
    if (e.kind === "approval_resolved") resolved(e.status);
  };
  ws.onclose = () => setTimeout(connect, 1000);
}
connect();
</script>
</body>
</html>
